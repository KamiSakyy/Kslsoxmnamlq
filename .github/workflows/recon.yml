          if fetch "https://porncado.com/8-hentai/" c-pc.html; then log "porncado.com/8-hentai OK $(wc -c < c-pc.html)"; else log "porncado.com/8-hentai FAIL"; fi
          log "== 2. первая карточка с каждой страницы (regex приложения) =="
          HS=$(grep -oE 'href="https?://[^"]*[0-9]+-[a-z0-9-]+\.html"' c-hs.html 2>/dev/null | head -1 | sed 's/href="//;s/"//')
          AH=$(grep -oE 'href="https?://[^"]*[0-9]+-[a-z0-9-]+\.html"' c-ah.html 2>/dev/null | head -1 | sed 's/href="//;s/"//')
          HK=$(grep -oE 'href="https?://[^"]*[0-9]+-[a-z0-9-]+\.html"' c-hk.html 2>/dev/null | head -1 | sed 's/href="//;s/"//')
