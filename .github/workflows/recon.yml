          tail -30 e2e-appflow.txt
      - name: Extract video candidates
        run: |
          set +e
          cd handoff/recon
          : > candidates.txt
          for f in *.html; do
            [ -s "$f" ] || continue
            echo "== $f ($(wc -c < "$f") bytes)" >> candidates.txt
            echo "-- m3u8:" >> candidates.txt
            grep -oiE 'https?:\\?/\\?/[^"'"'"' <>]+\.m3u8[^"'"'"' <>]*' "$f" | sort -u | head -20 >> candidates.txt
            echo "-- mp4:" >> candidates.txt
            grep -oiE 'https?:\\?/\\?/[^"'"'"' <>]+\.mp4[^"'"'"' <>]*' "$f" | sort -u | head -10 >> candidates.txt
            echo "-- media tags:" >> candidates.txt
            grep -oiE '<(iframe|video|source)[^>]{0,300}>' "$f" | head -20 >> candidates.txt
            echo "-- hls/player js:" >> candidates.txt
            grep -oiE '(hls\.js|new Hls|setupHls|videoUrl|video_url|file\s*:\s*")[^;]{0,200}' "$f" | head -20 >> candidates.txt
          done
          echo "-- hentakli player json:" >> candidates.txt
          grep -oE 'RalodePlayer\.init\(\{.{0,4000}' hentakli.html 2>/dev/null | head -c 4000 >> candidates.txt
          echo "" >> candidates.txt
          echo "-- allhentaii player config:" >> candidates.txt
          grep -oE 'playlist\.txt[^;]{0,400}' allhentaii.html 2>/dev/null | head -c 1500 >> candidates.txt
          echo "" >> candidates.txt
          echo "-- allhentaii playlist.txt:" >> candidates.txt
          head -c 2000 allhentaii-pl.txt >> candidates.txt 2>/dev/null || echo "missing" >> candidates.txt
          echo "" >> candidates.txt
          echo "-- hentasis files:" >> candidates.txt
          grep -oE 'file:"https://svt[^}]{0,160}' hentasis.html 2>/dev/null | head -30 >> candidates.txt
          echo "-- hentakli video.php iframe:" >> candidates.txt
          grep -oE '<iframe[^>]*>' hentakli-player.html 2>/dev/null | head -5 >> candidates.txt
          echo "-- hencdn head:" >> candidates.txt
          head -c 4000 hencdn.html >> candidates.txt 2>/dev/null || echo missing >> candidates.txt
          echo "-- shikimori r_plus:" >> candidates.txt
          head -c 2500 shikimori-rplus.json >> candidates.txt 2>/dev/null || echo "missing" >> candidates.txt
          echo "" >> candidates.txt
          echo "-- shikimori rx:" >> candidates.txt
          head -c 2500 shikimori-rx.json >> candidates.txt 2>/dev/null || echo "missing" >> candidates.txt
          echo "" >> candidates.txt
          echo "-- head probe:" >> candidates.txt
          cat head-probe.txt >> candidates.txt 2>/dev/null
          wc -l candidates.txt
          head -c 14000 candidates.txt
      - name: Probe m3u8
        run: |
          set +e
          cd handoff/recon
          grep -ohE 'https?:\\?/\\?/[^"'"'"' <>]+\.m3u8[^"'"'"' <>]*' *.html 2>/dev/null | sed 's/\\\\/\//g' | sort -u > m3u8s.txt
          : > m3u8-probe.txt
          while read -r u; do
            [ -z "$u" ] && continue
            echo "== $u" >> m3u8-probe.txt
            curl -s --max-time 25 -A "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/149.0.0.0 Mobile Safari/537.36" "$u" | head -c 1500 >> m3u8-probe.txt
            echo "" >> m3u8-probe.txt
          done < m3u8s.txt
          head -c 12000 m3u8-probe.txt
      - name: Upload recon artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hentai-recon
          path: handoff/recon
          if-no-files-found: ignore
      - name: Save recon
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A handoff/recon/
          git commit -m "Recon: hentai source data [skip ci]" || echo "nothing to commit"
          for attempt in 1 2 3; do
            if git push origin HEAD:arena/01a0a91e-reseeerooejcnc; then
              echo "RECON PUSH OK (attempt $attempt)"
              break
            fi
            echo "push failed, retry $attempt"
            sleep 8
            git pull --rebase origin arena/01a0a91e-reseeerooejcnc || git rebase --abort
          done
          git log --oneline -3
