          log "hentasis title: $HS"
          log "allhentaii title: $AH"
          log "hentakli title: $HK"
          log "porncado title: $PC"
          log "== 3. страницы тайтлов + первый файл (regex приложения) =="
          if [ -n "$HS" ]; then
            if fetch "$HS" t-hs.html; then log "hentasis title OK $(wc -c < t-hs.html)"; else log "hentasis title FAIL"; fi
            F=$(grep -oE 'file:"https://svt[^"]+\.mp4"' t-hs.html 2>/dev/null | head -1 | sed 's/file:"//;s/"//')
            log "hentasis file: ${F:0:140}"
            [ -n "$F" ] && rprobe "$F" "hentasis видео" hs
          fi
          if [ -n "$AH" ]; then
            if fetch "$AH" t-ah.html; then log "allhentaii title OK $(wc -c < t-ah.html)"; else log "allhentaii title FAIL"; fi
            P=$(grep -oE 'file:"(/pl/[^"]+)"' t-ah.html 2>/dev/null | head -1 | sed 's/file:"//;s/"//')
            log "allhentaii playlist path: $P"
            if [ -n "$P" ]; then
              if fetch "https://allhentaii.fun$P" pl-ah.txt; then log "allhentaii playlist OK"; else log "allhentaii playlist FAIL"; fi
              F=$(grep -oE '"file":"https://cdn[^"]+"' pl-ah.txt 2>/dev/null | head -1 | sed 's/"file":"//;s/"//')
              log "allhentaii file: ${F:0:140}"
              [ -n "$F" ] && rprobe "$F" "allhentaii видео" ah
            fi
          fi
          if [ -n "$HK" ]; then
            if fetch "$HK" t-hk.html; then log "hentakli title OK $(wc -c < t-hk.html)"; else log "hentakli title FAIL"; fi
            VID=$(grep -oE 'video\.php\?id=[0-9]+[^"\\]*' t-hk.html 2>/dev/null | head -1)
            log "hentakli video.php: $VID"
            if [ -n "$VID" ]; then
              if fetch "https://v6.hentakli.org/$VID" v-hk.html; then log "hentakli video.php OK $(wc -c < v-hk.html)"; else log "hentakli video.php FAIL"; fi
              HC=$(grep -oE 'hencdn\.top/video/[0-9]+' v-hk.html 2>/dev/null | head -1)
              [ -z "$HC" ] && HC="hencdn.top/video/157"
              log "hencdn: $HC"
              if fetch "https://$HC" p-hc.html; then log "hencdn page OK $(wc -c < p-hc.html)"; else log "hencdn page FAIL"; fi
              M=$(grep -oE 'https://[a-z0-9.-]+storage-hencdn\.com/[^"? ]+\.m3u8\?token=[^"& ]+' p-hc.html 2>/dev/null | head -1)
              [ -z "$M" ] && M=$(grep -oE 'https://[^" ]+\.m3u8[^" ]*' p-hc.html 2>/dev/null | head -1)
              log "hencdn m3u8: ${M:0:140}"
              [ -n "$M" ] && rprobe "$M" "hencdn видео" hc
            fi
          fi
          if [ -n "$PC" ]; then
            if fetch "$PC" t-pc.html; then log "porncado title OK $(wc -c < t-pc.html)"; else log "porncado title FAIL"; fi
            F=$(grep -oE 'https://xcdn[0-9]*\.nosofiles\.com/[^"]+_high\.mp4\?verify=[^"]+' t-pc.html 2>/dev/null | head -1)
            [ -z "$F" ] && F=$(grep -oE 'https://xcdn[0-9]*\.nosofiles\.com/[^"]+\.mp4\?verify=[^"]+' t-pc.html 2>/dev/null | head -1)
            log "porncado file: ${F:0:140}"
            [ -n "$F" ] && rprobe "$F" "porncado видео" pc
            if [ -n "$F" ]; then
              curl -s --max-time 25 -A "$UA" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: ru-RU,ru;q=0.9,en;q=0.5" -H "Referer: https://porncado.com/" "$F" -o probe-pc2.bin 2>/dev/null
