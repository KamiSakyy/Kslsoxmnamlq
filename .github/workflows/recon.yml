          log "an api/browse: bytes=$(wc -c < e-an.json)"
          ANEMB=$(python3 -c "
          import json
          try:
              d=json.load(open('e-an.json'))
              vs=[v for v in d['videos'] if v.get('embedUrl')]
              print(vs[0]['embedUrl'])
          except Exception:
              print('')
          " 2>/dev/null)
          log "an embed: $ANEMB"
          if [ -n "$ANEMB" ]; then
            case "$ANEMB" in http*) EMBU="$ANEMB";; /*) EMBU="https://animeidhentai.com$ANEMB";; *) EMBU="$ANEMB";; esac
            curl -sL --max-time 30 -A "$UA" -H "Referer: https://animeidhentai.com/" "$EMBU" -o e-an-emb.html 2>/dev/null
            log "an embed page: bytes=$(wc -c < e-an-emb.html)"
            ANVID=$(grep -oE 'vid=[A-Za-z0-9+/=]+' e-an-emb.html 2>/dev/null | head -1 | sed 's/vid=//')
            ANURL=$(echo "$ANVID" | base64 -d 2>/dev/null | head -1 | cut -d"|" -f1)
            log "an video: ${ANURL:0:140}"
            [ -n "$ANURL" ] && rprobe "$ANURL" "animeidhentai видео" an
          fi
          UAD="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
          curl -sL --max-time 30 -A "$UAD" "https://tube.hentaistream.com/?s=shoujo%20ramune" -o e-he-s.html 2>/dev/null
          log "he search: bytes=$(wc -c < e-he-s.html)"
          HESER=$(grep -oE 'https://tube\.hentaistream\.com/hentaidvd/[a-z0-9-]+' e-he-s.html 2>/dev/null | head -1)
          log "he series: $HESER"
          if [ -n "$HESER" ]; then
            curl -sL --max-time 30 -A "$UAD" "$HESER" -o e-he-ser.html 2>/dev/null
            log "he series page: bytes=$(wc -c < e-he-ser.html) eps=$(grep -c 'shoujo-ramune-episode' e-he-ser.html)"
            HEU=$(grep -oE 'https://tube\.hentaistream\.com/shoujo-ramune-episode-[0-9]+' e-he-ser.html 2>/dev/null | sort | head -1)
            log "he ep1: $HEU"
            if [ -n "$HEU" ]; then
              curl -sL --max-time 30 -A "$UAD" "$HEU" -o e-he-ep.html 2>/dev/null
              log "he episode page: bytes=$(wc -c < e-he-ep.html)"
              HEFR=$(grep -oE 'frames/(s[0-9]+[^"<> ]+?)\.html' e-he-ep.html 2>/dev/null | head -1)
              log "he frame: $HEFR"
              FU=""
              for cand in "$HEFR" "${HEFR}.html"; do
                [ -z "$cand" ] && continue
                curl -sL --max-time 30 -A "$UAD" "https://tube.hentaistream.com/${cand}" -o e-he-fr.html 2>/dev/null
                FU=$(grep -oE 'https://cdn[0-9]*\.streamhentai\.org/[A-Za-z0-9._%-]+\.mp4' e-he-fr.html 2>/dev/null | head -1)
                [ -n "$FU" ] && break
              done
              log "he video: ${FU:0:140}"
              [ -n "$FU" ] && rprobe "$FU" "hentaistream видео (Shoujo Ramune)" he
            fi
          fi
          log "== 6. новый источник: hentai.tv (htv) + nhplayer =="
          curl -s --max-time 30 -A "$UA" "https://hentai.tv/" -o e-htv.html 2>/dev/null
          log "htv home: bytes=$(wc -c < e-htv.html) cards=$(grep -oE 'nhplayer\.com/v/[A-Za-z0-9]+' e-htv.html 2>/dev/null | sort -u | wc -l)"
          HTVEMB=$(grep -oE 'nhplayer\.com/v/[A-Za-z0-9]+' e-htv.html 2>/dev/null | head -1)
          log "htv first embed: $HTVEMB"
          if [ -n "$HTVEMB" ]; then
            curl -s --max-time 30 -A "$UA" -H "Referer: https://hentai.tv/" "https://nhplayer.com/v/$HTVEMB/" -o e-htv-emb.html 2>/dev/null
            log "htv nhplayer page: bytes=$(wc -c < e-htv-emb.html)"
