      - name: E2E app flow
        run: |
          set +e
          cd handoff/recon
          : > e2e-appflow.txt
          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Mobile Safari/537.36"
          ACC="application/json,text/html;q=0.9,*/*;q=0.6"
          log() {
            echo "$@" >> e2e-appflow.txt
            echo "$@"
          }
          fetch() {
            curl -sL --max-time 40 -A "$UA" -H "Accept: $ACC" "$1" -o "$2" 2>/dev/null
            [ -s "$2" ]
          }
          rprobe() {
            local u="$1" tag="$2" bin="probe-$3.bin"
            curl -s --max-time 25 -A "$UA" -H "Accept: video/*,application/vnd.apple.mpegurl,application/dash+xml,*/*;q=0.5" -H "Range: bytes=0-8191" "$u" -o "$bin" 2>/dev/null
            local sz=0
            [ -s "$bin" ] && sz=$(wc -c < "$bin")
            local sig=""
            if [ -s "$bin" ] && head -c 2000 "$bin" | grep -q "#EXTM3U"; then sig="HLS"; fi
            if [ -s "$bin" ] && head -c 2000 "$bin" | grep -qa "ftyp"; then sig="$sig MP4"; fi
            if [ -s "$bin" ] && head -c 2000 "$bin" | grep -q "<MPD"; then sig="$sig DASH"; fi
            [ -z "$sig" ] && sig="NONE"
            log "$tag: ${u:0:130} -> bytes=$sz sig=$sig"
          }
          log "== 1. catalog pages (заголовки приложения) =="
          if fetch "https://hentasis1.top/" c-hs.html; then log "hentasis1.top OK $(wc -c < c-hs.html)"; else log "hentasis1.top FAIL"; fi
