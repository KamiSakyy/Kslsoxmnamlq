<script>
    const TRUSTED_ORIGINS = ["https:\/\/anibase.org","https:\/\/base.com","https:\/\/hentflix.local","https:\/\/*.hentflix.org","anifap.local","anifap.com","https:\/\/*.afap.me","https:\/\/*.afap.top"];

    function parseOrigin(value) {
        try {
            return new URL(value).origin;
        } catch (error) {
            return null;
        }
    }

    function parseOriginPattern(value) {
        const pattern = String(value || '').trim().replace(/\/+$/, '');

        if (!pattern) return null;

        const wildcardOriginMatch = pattern.match(/^([a-z][a-z0-9+.-]*:)\/\/\*\.([^/]+)$/i);

        if (wildcardOriginMatch) {
            return {
                origin: null,
                protocol: wildcardOriginMatch[1].toLowerCase(),
                hostname: '*.' + wildcardOriginMatch[2].toLowerCase(),
                wildcard: true,
            };
        }

        const parsedOrigin = parseOrigin(pattern);

        if (parsedOrigin) {
            const parsedUrl = new URL(parsedOrigin);

            return {
                origin: parsedOrigin,
                protocol: parsedUrl.protocol,
                hostname: parsedUrl.hostname,
                wildcard: parsedUrl.hostname.startsWith('*.'),
            };
        }

        return {
            origin: null,
            protocol: null,
            hostname: pattern.toLowerCase(),
            wildcard: pattern.toLowerCase().startsWith('*.'),
        };
    }

    function originMatchesPattern(origin, pattern) {
        const parsedOrigin = parseOrigin(origin);
        const parsedPattern = parseOriginPattern(pattern);

        if (!parsedOrigin || !parsedPattern) return false;
        if (parsedPattern.origin && parsedPattern.origin === parsedOrigin) return true;

        const originUrl = new URL(parsedOrigin);

        if (parsedPattern.protocol && parsedPattern.protocol !== originUrl.protocol) {
            return false;
        }

        if (!parsedPattern.wildcard) {
            return !parsedPattern.protocol && parsedPattern.hostname === originUrl.hostname;
        }

        const wildcardHostname = parsedPattern.hostname.slice(2);

        return originUrl.hostname === wildcardHostname || originUrl.hostname.endsWith('.' + wildcardHostname);
    }

    function exactTrustedOrigins() {
        return TRUSTED_ORIGINS
            .map(parseOriginPattern)
            .filter((pattern) => pattern && pattern.origin && !pattern.wildcard)
            .map((pattern) => pattern.origin)
            .filter((origin, index, origins) => origins.indexOf(origin) === index);
    }

    function isTrusted(origin) {
        return TRUSTED_ORIGINS.some((trustedOrigin) => originMatchesPattern(origin, trustedOrigin));
    }

    window.addEventListener('message', (event) => {
        if (!isTrusted(event.origin)) return;

        const msg = event.data || {};
        if (msg.type === 'vc_pause') {
            player.ready(() => player.pause());
            return;
        }
        if (msg.type !== 'vc_seek') return;

        const t = Number(msg.time);
        if (!Number.isFinite(t) || t < 0) return;

        player.ready(() => {
            player.currentTime(t);

            if (!msg.autoplay) return;

            const playPromise = player.play();

            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {
                    player.muted(true);

                    const mutedPlayPromise = player.play();

                    if (mutedPlayPromise && typeof mutedPlayPromise.catch === 'function') {
                        mutedPlayPromise.catch(() => {});
                    }
                });
            }
        });
    });

<script>
    let historySent = false;
    let historyWatchedSeconds = 0;
    let historyLastTime = null;

    function parentOriginFromReferrer() {
        try {
            return document.referrer ? new URL(document.referrer).origin : null;
        } catch (error) {
            return null;
        }
    }

    function sendHistoryEvent() {
        if (historySent) return;

        historySent = true;

        const payload = {
            type: 'episode_history_record',
            current_time: player.currentTime(),
            duration: player.duration(),
        };

        const parentOrigin = parentOriginFromReferrer();

        if (parentOrigin && isTrusted(parentOrigin)) {
            window.parent.postMessage(payload, parentOrigin);
            return;
        }

        exactTrustedOrigins().forEach((origin) => {
            window.parent.postMessage(payload, origin);
        });
    }

    player.ready(() => {
        player.on('play', () => {
            historyLastTime = player.currentTime();
        });

        ['pause', 'ended', 'seeking', 'waiting'].forEach((eventName) => {
            player.on(eventName, () => {
                historyLastTime = null;
            });
        });

        player.on('timeupdate', () => {
            if (historySent || player.paused() || player.seeking()) return;

            const currentTime = player.currentTime();

            if (historyLastTime === null) {
                historyLastTime = currentTime;
                return;
            }

            const delta = currentTime - historyLastTime;
            historyLastTime = currentTime;

            if (delta <= 0 || delta > 5) return;

            historyWatchedSeconds += delta;

            if (historyWatchedSeconds >= 30) {
                sendHistoryEvent();
            }
        });
    });




    function postEditorEvent(payload) {
        const parentOrigin = parentOriginFromReferrer();

        if (parentOrigin && isTrusted(parentOrigin)) {
            window.parent.postMessage(payload, parentOrigin);
            return;
        }

        exactTrustedOrigins().forEach((origin) => {
            window.parent.postMessage(payload, origin);
        });
    }

    player.ready(() => {
        const payload = () => ({
            current_time: player.currentTime(),
            duration: player.duration(),
        });

        postEditorEvent({
            type: 'vc_player_ready',
            ...payload(),
        });

        player.on('play', () => {
            postEditorEvent({ type: 'vc_player_play', ...payload() });
        });

        player.on('pause', () => {
            postEditorEvent({ type: 'vc_player_pause', ...payload() });
        });

        player.on('ended', () => {
            postEditorEvent({ type: 'vc_player_ended', ...payload() });
        });

        player.on('seeked', () => {
            postEditorEvent({ type: 'vc_player_seeked', ...payload() });
        });

        player.on('timeupdate', () => {
            postEditorEvent({ type: 'vc_player_timeupdate', ...payload() });
        });

    });
</script>
